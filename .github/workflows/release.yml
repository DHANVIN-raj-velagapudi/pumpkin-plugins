name: Release

# WebAssembly components are platform-independent, so one build covers every
# server OS. This runs on a tagged version and on every push to main, the same
# two-track pattern as the panel: tags are real releases, main keeps a rolling
# "latest" build.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # The plugin API is published on crates.io, pinned to the server version
      # in the workspace Cargo.toml, so no checkout of the server is needed.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --target wasm32-wasip2 -- -D warnings

      # The pure logic (stores, parsing, JSON layout) is tested natively; only
      # the glue that calls into the server needs a real server to exercise.
      # `--lib` runs just the unit tests. A plain `cargo test` also links each
      # plugin as a native shared library, which Linux rejects because the WIT
      # export names contain `:` and `@`; the wasm build below is the real one.
      - name: Test
        run: cargo test --workspace --lib

      - name: Build every plugin
        run: cargo build --release --target wasm32-wasip2 --workspace

      - name: Collect the built components
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/*.wasm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*.wasm
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: dist

      - name: Release a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasm
          generate_release_notes: true

      - name: Update the rolling latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (main)"
          prerelease: true
          make_latest: false
          body: |
            Automatically rebuilt from the latest commit on `main`:
            ${{ github.sha }}

            Development build. For a stable version, see the
            [Releases page](../../releases) for a `v*` tag.
          files: dist/*.wasm
